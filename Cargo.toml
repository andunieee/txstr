[package]
name = "txstr"
version = "0.1.1"
description = "decentralised, minimalist microblogging for hackers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/andunieee/txstr"
homepage = "https://andunieee.github.io/txstr/"
documentation = "https://andunieee.github.io/txstr/"
keywords = ["microblogging", "social", "cli", "twtxt", "nostr"]
categories = ["command-line-utilities"]
rust-version = "1.91"
edition = "2024"
exclude = [
    ".github/**",
    "docs/.nojekyll",
    "docs/demo/play.sh",
    "docs/demo/record.sh",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ritualistic = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.6"
